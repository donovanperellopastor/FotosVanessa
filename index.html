<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Galería de Drive</title>
    <style>
        /* CSS básico para la galería */
        body { font-family: sans-serif; text-align: center; }
        #galeria {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
            padding: 20px;
        }
        .foto {
            width: 100%;
            height: 250px;
            object-fit: cover;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: transform 0.3s;
        }
        .foto:hover { transform: scale(1.05); }
    </style>
</head>
<body>

    <h1>Fotos desde Google Drive</h1>
    <p id="cargando">Cargando imágenes...</p>
    <div id="galeria"></div>

    <script>
        // PEGA AQUÍ LA URL QUE COPIASTE EN EL PASO 3
        const URL_APPS_SCRIPT = 'AQUI_PON_LA_URL_DE_TU_APLICACION_WEB';

        async function cargarFotos() {
            try {
                const respuesta = await fetch(URL_APPS_SCRIPT);
                const fotos = await respuesta.json();
                
                const contenedor = document.getElementById('galeria');
                document.getElementById('cargando').style.display = 'none';

                fotos.forEach(foto => {
                    const img = document.createElement('img');
                    img.src = foto.url;
                    img.alt = foto.name;
                    img.className = 'foto';
                    contenedor.appendChild(img);
                });
            } catch (error) {
                console.error("Error al cargar las fotos:", error);
                document.getElementById('cargando').innerText = "Hubo un error al cargar las fotos.";
            }
        }

        // Ejecutar al cargar la página
        cargarFotos();
    </script>
</body>
</html>
